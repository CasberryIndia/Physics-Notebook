<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0d0d0f"/>
  <!-- Atom nucleus -->
  <circle cx="16" cy="16" r="2.5" fill="#2563eb"/>
  <!-- Orbit ring 1 (horizontal) -->
  <ellipse cx="16" cy="16" rx="10" ry="4" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.9"/>
  <!-- Orbit ring 2 (tilted 60deg) -->
  <ellipse cx="16" cy="16" rx="10" ry="4" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.7"
    transform="rotate(60 16 16)"/>
  <!-- Orbit ring 3 (tilted 120deg) -->
  <ellipse cx="16" cy="16" rx="10" ry="4" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.5"
    transform="rotate(120 16 16)"/>
</svg>
