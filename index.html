        // ------------------------------------------------------------------
        // VISUALIZATION CLASSES (Mini-Sims)
        // ------------------------------------------------------------------

        class BaseVisual {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.isVisible = false;

                // Initialize Colors
                this.updateColors();

                // Random start time so they're not all synced perfectly
                this.time = Math.random() * 100;

                // Initial resize
                this.resize();
            }

            updateColors() {
                this.color = getComputedStyle(document.body).getPropertyValue('--text-main').trim();
                this.accent = getComputedStyle(document.body).getPropertyValue('--accent').trim();
                this.accentSecondary = getComputedStyle(document.body).getPropertyValue('--accent-secondary').trim() || '#3498db'; // Fallback
            }

            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                this.width = this.canvas.width;
                this.height = this.canvas.height;
            }

            clear() {
                this.ctx.clearRect(0, 0, this.width, this.height);
            }

            // Should be overridden
            draw() { }
        }

        class OscillationVisual extends BaseVisual {
            draw() {
                if (!this.isVisible) return;
                this.time += 0.05;
                this.clear();
                const x = Math.sin(this.time) * (this.width * 0.3);
                const cx = this.width / 2;
                const cy = this.height / 2;

                this.ctx.strokeStyle = this.color;
                this.ctx.lineWidth = 1.5;
                this.ctx.beginPath();
                this.ctx.moveTo(cx - (this.width * 0.35), cy);
                for (let i = 0; i < 20; i++) {
                    let px = (cx - (this.width * 0.35)) + ((x + (this.width * 0.35)) / 20) * i;
                    let py = cy + (i % 2 == 0 ? -5 : 5);
                    this.ctx.lineTo(px, py);
                }
                this.ctx.lineTo(cx + x, cy);
                this.ctx.stroke();

                this.ctx.fillStyle = this.accent;
                this.ctx.beginPath();
                this.ctx.arc(cx + x, cy, 8, 0, Math.PI * 2);
                this.ctx.fill();
            }
        }

        class ProjectileVisual extends BaseVisual {
            constructor(c) { super(c); this.t = 0; }
            draw() {
                if (!this.isVisible) return;
                this.t += 0.02;
                if (this.t > 2) this.t = 0;
                this.clear();

                const startX = 20;
                const startY = this.height - 20;
                const simX = this.t * (this.width * 0.8);
                const normT = this.t / 2;
                const simY = (normT * 4 - Math.pow(normT * 2, 2)) * (this.height * 0.8);

                this.ctx.fillStyle = this.accent;
                this.ctx.beginPath();
                this.ctx.arc(startX + simX, startY - simY, 6, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.strokeStyle = this.color;
                this.ctx.globalAlpha = 0.2;
                this.ctx.beginPath();
                for (let i = 0; i < this.t; i += 0.05) {
                    let sx = i * (this.width * 0.8);
                    let nT = i / 2;
                    let sy = (nT * 4 - Math.pow(nT * 2, 2)) * (this.height * 0.8);
                    this.ctx.lineTo(startX + sx, startY - sy);
                }
                this.ctx.stroke();
                this.ctx.globalAlpha = 1;
            }
        }

        class WavesVisual extends BaseVisual {
            draw() {
                if (!this.isVisible) return;
                this.time += 0.05;
                this.clear();
                this.ctx.beginPath();
                this.ctx.strokeStyle = this.accent;
                this.ctx.lineWidth = 2;

                for (let x = 0; x < this.width; x += 5) {
                    const y = Math.sin(x * 0.05 + this.time) * 20 + Math.sin(x * 0.03 - this.time) * 10;
                    if (x === 0) this.ctx.moveTo(x, this.height / 2 + y);
                    else this.ctx.lineTo(x, this.height / 2 + y);
                }
                this.ctx.stroke();
            }
        }

        class OrbitVisual extends BaseVisual {
            draw() {
                if (!this.isVisible) return;
                this.time += 0.03;
                this.clear();
                const cx = this.width / 2;
                const cy = this.height / 2;

                this.ctx.fillStyle = this.color;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, 15, 0, Math.PI * 2);
                this.ctx.fill();

                const rx = this.width * 0.3;
                const ry = this.height * 0.2;
                const x = cx + Math.cos(this.time) * rx;
                const y = cy + Math.sin(this.time) * ry;

                this.ctx.strokeStyle = this.color;
                this.ctx.globalAlpha = 0.1;
                this.ctx.beginPath();
                this.ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                this.ctx.stroke();
                this.ctx.globalAlpha = 1;

                this.ctx.fillStyle = this.accent;
                this.ctx.beginPath();
                this.ctx.arc(x, y, 6, 0, Math.PI * 2);
                this.ctx.fill();
            }
        }

        class FieldVisual extends BaseVisual {
            draw() {
                if (!this.isVisible) return;
                this.time += 0.02;
                this.clear();
                const cx = this.width / 2;
                const cy = this.height / 2;

                this.ctx.fillStyle = this.color;
                for (let x = 20; x < this.width; x += 40) {
                    for (let y = 20; y < this.height; y += 40) {
                        const dx = x - cx;
                        const dy = y - cy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const offset = (this.time * 20) % 20;
                        const angle = Math.atan2(dy, dx);
                        const px = x + Math.cos(angle) * offset;
                        const py = y + Math.sin(angle) * offset;
                        const size = Math.max(0, 3 - (dist / 150));
                        this.ctx.beginPath();
                        this.ctx.arc(px, py, size, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }
            }
        }

        class PendulumVisual extends BaseVisual {
            draw() {
                if (!this.isVisible) return;
                this.time += 0.05;
                this.clear();
                const cx = this.width / 2;
                const angle = Math.sin(this.time) * 0.5;
                const len = this.height * 0.6;
                const endX = cx + Math.sin(angle) * len;
                const endY = 20 + Math.cos(angle) * len;

                this.ctx.strokeStyle = this.color;
                this.ctx.beginPath();
                this.ctx.moveTo(cx, 20);
                this.ctx.lineTo(endX, endY);
                this.ctx.stroke();

                this.ctx.fillStyle = this.accent;
                this.ctx.beginPath();
                this.ctx.arc(endX, endY, 10, 0, Math.PI * 2);
                this.ctx.fill();
            }
        }

        class ConservationEnergyVisual extends BaseVisual {
            constructor(canvas) {
                super(canvas);
                this.angle = 0;
                this.barW = 15;
                this.maxH = 40;
            }

            draw() {
                if (!this.isVisible) return;
                this.angle += 0.05;

                // Clear
                this.clear();

                // Two bars trading height
                const pe = (Math.sin(this.angle) + 1) / 2; // 0 to 1
                const ke = 1 - pe;

                const baseY = (this.height / 2) + 25;
                const cx = this.width / 2;

                // PE Bar
                this.ctx.fillStyle = this.accent;
                this.ctx.fillRect(cx - 25, baseY - (pe * this.maxH), this.barW, pe * this.maxH);

                // KE Bar
                this.ctx.fillStyle = '#3498db'; // Another distinct color
                this.ctx.fillRect(cx + 10, baseY - (ke * this.maxH), this.barW, ke * this.maxH);

                // Total Energy Line (Constant)
                this.ctx.strokeStyle = this.color;
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(cx - 35, baseY - this.maxH);
                this.ctx.lineTo(cx + 35, baseY - this.maxH);
                this.ctx.stroke();

                // Base Line
                this.ctx.beginPath();
                this.ctx.moveTo(cx - 35, baseY);
                this.ctx.lineTo(cx + 35, baseY);
                this.ctx.stroke();
            }
        }

        class MomentumVisual extends BaseVisual {
            constructor(canvas) {
                super(canvas);
                this.time = 0;
                this.m1 = 15;
                this.m2 = 25;
                this.x1 = 20;
                this.x2 = this.width - 20; // Initialize x2 based on canvas width
                this.v1 = 1.5;
                this.v2 = -1;
            }

            // Override resize to re-initialize x2
            resize() {
                super.resize();
                this.x2 = this.width - 20;
            }

            draw() {
                if (!this.isVisible) return;
                this.clear();

                // Update positions
                this.x1 += this.v1;
                this.x2 += this.v2;

                // Elastic Collision logic
                // Check for collision: if balls are overlapping and moving towards each other
                if (Math.abs(this.x1 - this.x2) <= (this.m1 + this.m2) / 2 && ((this.v1 > 0 && this.v2 < 0) || (this.v1 < 0 && this.v2 > 0))) {
                    const tempV1 = this.v1;
                    this.v1 = (this.v1 * (this.m1 - this.m2) + (2 * this.m2 * this.v2)) / (this.m1 + this.m2);
                    this.v2 = (this.v2 * (this.m2 - this.m1) + (2 * this.m1 * tempV1)) / (this.m1 + this.m2);
                    // Small adjustment to prevent sticking
                    this.x1 += this.v1 * 0.5;
                    this.x2 += this.v2 * 0.5;
                }

                // Reset when out of bounds
                if (this.x1 < -50 || this.x2 > this.width + 50 || this.x1 > this.width + 50 || this.x2 < -50) {
                    this.x1 = 20; this.v1 = 1.5;
                    this.x2 = this.width - 20; this.v2 = -1;
                }

                const py = this.height / 2;

                const drawBall = (x, r, colorCode) => {
                    this.ctx.fillStyle = colorCode;
                    this.ctx.beginPath();
                    this.ctx.arc(x, py, r, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Motion blur / trail hint
                    this.ctx.globalAlpha = 0.3;
                    this.ctx.beginPath();
                    // Draw a slightly offset, faded circle in the direction of motion
                    const trailOffset = (this.v1 > 0 && x === this.x1) || (this.v2 > 0 && x === this.x2) ? -5 : 5;
                    this.ctx.arc(x + trailOffset, py, r, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1.0;
                };

                drawBall(this.x1, this.m1, this.accent);
                drawBall(this.x2, this.m2, this.accentSecondary);
            }
        }

        class SlitVisual extends BaseVisual {
            draw() {
                if (!this.isVisible) return;
                this.time += 0.1;
                this.clear();
                const bands = 20;
                const w = this.width / bands;
                for (let i = 0; i < bands; i++) {
                    const center = bands / 2;
                    const dist = Math.abs(i - center);
                    const intensity = Math.max(0, 1 - (dist * 0.2)) + (Math.sin(this.time + i) * 0.1);
                    this.ctx.fillStyle = this.accent;
                    this.ctx.globalAlpha = intensity * 0.8;
                    this.ctx.fillRect(i * w, 0, w, this.height);
                }
                this.ctx.globalAlpha = 1;
            }
        }

        class MagneticVisual extends BaseVisual {
            draw() {
                if (!this.isVisible) return;
                this.time += 0.02;
                this.clear();
                const cx = this.width / 2;
                const cy = this.height / 2;

                // Rotating dipole moment
                const mx = Math.cos(this.time);
                const my = Math.sin(this.time);

                // Draw grid of compass needles
                const spacing = 30;
                for (let x = spacing / 2; x < this.width; x += spacing) {
                    for (let y = spacing / 2; y < this.height; y += spacing) {
                        const dx = x - cx;
                        const dy = y - cy;
                        const r2 = dx * dx + dy * dy;

                        // Avoid singularity at the exact center
                        if (r2 < spacing * spacing / 4) continue;

                        const r = Math.sqrt(r2);
                        const r5 = r2 * r2 * r;

                        // Dot product m * r
                        const m_dot_r = mx * dx + my * dy;

                        // B vector (dipole field)
                        // B ∝ 3 * (m . r) * r - r^2 * m
                        const bx = (3 * m_dot_r * dx - r2 * mx) / r5;
                        const by = (3 * m_dot_r * dy - r2 * my) / r5;

                        // Normalize B for drawing direction
                        const bMag = Math.sqrt(bx * bx + by * by);
                        if (bMag === 0) continue;
                        const nx = bx / bMag;
                        const ny = by / bMag;

                        // Opacity based on field strength (normalized roughly for visual appeal)
                        // At r=100, r^3 = 1,000,000.
                        const strength = Math.min(1, 1000000 / (r2 * r));

                        const len = spacing * 0.35;

                        this.ctx.globalAlpha = 0.15 + 0.85 * strength;
                        this.ctx.strokeStyle = this.accent;
                        this.ctx.lineWidth = 1.5;

                        // Draw needle line
                        this.ctx.beginPath();
                        this.ctx.moveTo(x - nx * len, y - ny * len);
                        this.ctx.lineTo(x + nx * len, y + ny * len);
                        this.ctx.stroke();

                        // Draw needle head (pointing in direction of B)
                        this.ctx.fillStyle = this.accent;
                        this.ctx.beginPath();
                        this.ctx.arc(x + nx * len, y + ny * len, 1.5, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }

                this.ctx.globalAlpha = 1;

                // Draw the central dipole (a tiny bar magnet)
                const magLen = 15;
                this.ctx.lineWidth = 6;
                this.ctx.lineCap = 'round';

                // North pole (red)
                this.ctx.strokeStyle = '#e74c3c';
                this.ctx.beginPath();
                this.ctx.moveTo(cx, cy);
                this.ctx.lineTo(cx + mx * magLen, cy + my * magLen);
                this.ctx.stroke();

                // South pole (blue)
                this.ctx.strokeStyle = '#3498db';
                this.ctx.beginPath();
                this.ctx.moveTo(cx, cy);
                this.ctx.lineTo(cx - mx * magLen, cy - my * magLen);
                this.ctx.stroke();

                this.ctx.lineCap = 'butt'; // reset
            }
        }

        class GravitationalWavesVisual extends BaseVisual {
            draw() {
                if (!this.isVisible) return;
                this.time += 0.02;
                this.clear();
                const cx = this.width / 2;
                const cy = this.height / 2;

                this.ctx.strokeStyle = this.accent;
                this.ctx.lineWidth = 1.5;

                // Draw expanding rings (quadrupole pattern approximation)
                for (let i = 0; i < 4; i++) {
                    const radius = ((this.time * 20 + i * 40) % 150) + 10;
                    const alpha = 1 - (radius / 160);

                    this.ctx.globalAlpha = Math.max(0, alpha);
                    this.ctx.beginPath();

                    // Elliptical distortion to simulate quadrupole wave
                    const distortX = 1 + 0.2 * Math.sin(this.time * 2);
                    const distortY = 1 - 0.2 * Math.sin(this.time * 2);

                    this.ctx.ellipse(cx, cy, radius * distortX, radius * distortY, 0, 0, Math.PI * 2);
                    this.ctx.stroke();
                }

                this.ctx.globalAlpha = 1;

                // Draw rotating binary system in center
                const binaryAngle = this.time * 5;
                const binarySep = 10;

                this.ctx.fillStyle = this.color;
                this.ctx.beginPath();
                this.ctx.arc(cx + Math.cos(binaryAngle) * binarySep, cy + Math.sin(binaryAngle) * binarySep, 4, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.beginPath();
                this.ctx.arc(cx - Math.cos(binaryAngle) * binarySep, cy - Math.sin(binaryAngle) * binarySep, 4, 0, Math.PI * 2);
                this.ctx.fill();
            }
        }

        class NewtonsLawsVisual extends BaseVisual {
            draw() {
                if (!this.isVisible) return;
                this.time += 0.05;
                this.clear();
                const cx = this.width / 2;
                const cy = this.height / 2;

                const offset = Math.abs(Math.sin(this.time)) * 20;

                this.ctx.fillStyle = this.accent;
                this.ctx.beginPath();
                this.ctx.roundRect(cx - 15 - offset, cy - 10, 20, 20, 4);
                this.ctx.fill();

                this.ctx.strokeStyle = this.color;
                this.ctx.fillStyle = this.color;
                this.ctx.lineWidth = 2;

                // Arrows pointing outwards
                this.ctx.beginPath(); this.ctx.moveTo(cx - 20 - offset, cy); this.ctx.lineTo(cx - 30 - offset, cy); this.ctx.stroke();

                this.ctx.beginPath();
                this.ctx.roundRect(cx + 15 + offset, cy - 10, 20, 20, 4);
                this.ctx.fill();

                this.ctx.beginPath(); this.ctx.moveTo(cx + 20 + offset, cy); this.ctx.lineTo(cx + 30 + offset, cy); this.ctx.stroke();
            }
        }

        class WorkEnergyCardVisual extends BaseVisual {
            constructor(canvas) {
                super(canvas);
                this.blockX = 20;
                this.blockW = 24;
                this.blockH = 16;
                this.v = 0;
                this.a = 0.05;
                this.maxKE = 1.0;
            }

            draw() {
                if (!this.isVisible) return;
                this.time += 0.03;
                this.clear();

                const cx = this.width / 2;
                const cy = this.height / 2;
                const trackY = cy + 10;
                const trackStart = 30;
                const trackEnd = this.width - 30;
                const trackLen = trackEnd - trackStart;

                // Draw track line
                this.ctx.strokeStyle = this.color;
                this.ctx.globalAlpha = 0.2;
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(trackStart, trackY);
                this.ctx.lineTo(trackEnd, trackY);
                this.ctx.stroke();
                this.ctx.globalAlpha = 1.0;

                // Animate position: accelerates from rest and resets
                const cycleTime = (this.time * 20) % 100;
                let t = cycleTime / 100;
                
                let px = trackStart + (t * t) * trackLen;
                let keRatio = t * t;

                // Draw block
                this.ctx.fillStyle = this.accent;
                this.ctx.beginPath();
                this.ctx.roundRect(px - this.blockW / 2, trackY - this.blockH, this.blockW, this.blockH, 3);
                this.ctx.fill();

                // Draw Applied Force vector arrow pointing right
                if (t < 0.95) {
                    this.ctx.strokeStyle = this.accentSecondary;
                    this.ctx.fillStyle = this.accentSecondary;
                    this.ctx.lineWidth = 2;
                    
                    const arrowY = trackY - this.blockH / 2;
                    const arrowStartX = px - this.blockW / 2 - 25;
                    const arrowEndX = px - this.blockW / 2 - 5;
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(arrowStartX, arrowY);
                    this.ctx.lineTo(arrowEndX, arrowY);
                    this.ctx.stroke();
                    
                    // Arrowhead
                    this.ctx.beginPath();
                    this.ctx.moveTo(arrowEndX, arrowY);
                    this.ctx.lineTo(arrowEndX - 5, arrowY - 4);
                    this.ctx.lineTo(arrowEndX - 5, arrowY + 4);
                    this.ctx.fill();
                    
                    // Small "F" label
                    this.ctx.font = '9px monospace';
                    this.ctx.fillText("F", arrowStartX + 5, arrowY - 6);
                }

                // Draw Kinetic Energy progress bar below track
                const barW = 60;
                const barH = 5;
                const barX = cx - barW / 2;
                const barY = cy + 25;

                // Label KE
                this.ctx.fillStyle = this.color;
                this.ctx.font = '10px monospace';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(`KE: ${Math.round(keRatio * 100)}%`, cx, barY - 4);

                // Bar Background
                this.ctx.fillStyle = this.color;
                this.ctx.globalAlpha = 0.1;
                this.ctx.fillRect(barX, barY, barW, barH);
                this.ctx.globalAlpha = 1.0;

                // Bar Fill
                this.ctx.fillStyle = this.accent;
                this.ctx.fillRect(barX, barY, barW * keRatio, barH);
            }
        }

        class SpecialRelativityVisual extends BaseVisual {
            constructor(canvas) {
                super(canvas);
                this.v = 0;
            }

            draw() {
                if (!this.isVisible) return;
                this.time += 0.02;
                this.clear();

                const cx = this.width / 2;
                const cy = this.height / 2;

                // Speed oscillates between 0.0 and 0.90 to show breathing contraction cycles
                const speed = 0.45 + 0.45 * Math.sin(this.time);
                const gamma = 1 / Math.sqrt(1 - speed * speed);

                // 1. Draw Stationary Reference grid (Observer S) - very faint blue/gray
                this.ctx.strokeStyle = this.color;
                this.ctx.lineWidth = 1;
                this.ctx.globalAlpha = 0.06;

                const gridSpacing = 16;
                const gridW = 120;
                const gridH = 60;

                // Horizontal lines
                for (let y = -gridH; y <= gridH; y += gridSpacing) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(cx - gridW, cy + y);
                    this.ctx.lineTo(cx + gridW, cy + y);
                    this.ctx.stroke();
                }

                // Vertical lines
                for (let x = -gridW; x <= gridW; x += gridSpacing) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(cx + x, cy - gridH);
                    this.ctx.lineTo(cx + x, cy + gridH);
                    this.ctx.stroke();
                }

                // 2. Draw moving coordinate system (Observer S') - relativistic length contracted horizontally!
                this.ctx.strokeStyle = this.accentSecondary;
                this.ctx.lineWidth = 1.5;
                this.ctx.globalAlpha = 0.35;

                // Contracted spacing along x-axis
                const spacingContracted = gridSpacing / gamma;

                // Horizontal lines (remain unchanged in transverse height)
                for (let y = -gridH; y <= gridH; y += gridSpacing) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(cx - gridW / gamma, cy + y);
                    this.ctx.lineTo(cx + gridW / gamma, cy + y);
                    this.ctx.stroke();
                }

                // Vertical lines (compressed spacing!)
                for (let x = -gridW / gamma; x <= gridW / gamma; x += spacingContracted) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(cx + x, cy - gridH);
                    this.ctx.lineTo(cx + x, cy + gridH);
                    this.ctx.stroke();
                }

                this.ctx.globalAlpha = 1.0;

                // Label showing relative speed ratio v/c
                this.ctx.fillStyle = this.color;
                this.ctx.font = '10px monospace';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(`v/c: ${speed.toFixed(3)} (γ: ${gamma.toFixed(2)})`, cx, cy + gridH + 18);
            }
        }

        class RotationalDynamicsVisual extends BaseVisual {
            constructor(canvas) {
                super(canvas);
                this.time = 0;
            }

            draw() {
                if (!this.isVisible) return;
                this.time += 0.04;
                this.clear();

                const cx = this.width / 2;
                const cy = this.height / 2;
                const r = Math.min(cx, cy) * 0.7;

                // Draw central axis
                this.ctx.fillStyle = this.color;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, 4, 0, Math.PI * 2);
                this.ctx.fill();

                // Draw rotating ring/disk
                this.ctx.strokeStyle = this.accent;
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, r, 0, Math.PI * 2);
                this.ctx.stroke();

                // Draw two mass point spheres rotating
                const x1 = cx + Math.cos(this.time) * r;
                const y1 = cy + Math.sin(this.time) * r;
                const x2 = cx - Math.cos(this.time) * r;
                const y2 = cy - Math.sin(this.time) * r;

                this.ctx.fillStyle = this.accent;
                this.ctx.beginPath();
                this.ctx.arc(x1, y1, 6, 0, Math.PI * 2);
                this.ctx.arc(x2, y2, 6, 0, Math.PI * 2);
                this.ctx.fill();

                // Connecting rod
                this.ctx.strokeStyle = this.color;
                this.ctx.lineWidth = 1;
                this.ctx.globalAlpha = 0.4;
                this.ctx.beginPath();
                this.ctx.moveTo(x1, y1);
                this.ctx.lineTo(x2, y2);
                this.ctx.stroke();
                this.ctx.globalAlpha = 1.0;
            }
        }

        class LagrangianHamiltonianVisual extends BaseVisual {
            constructor(canvas) {
                super(canvas);
                this.time = 0;
            }

            draw() {
                if (!this.isVisible) return;
                this.time += 0.05;
                this.clear();

                const cx = this.width / 2;
                const cy = this.height / 2;
                const r = Math.min(cx, cy) * 0.45;

                // Simple chaotic double pendulum visual representation on the card
                const x1 = cx + Math.sin(this.time) * r;
                const y1 = cy + Math.cos(this.time) * r;
                const x2 = x1 + Math.sin(this.time * 2.3) * r * 0.8;
                const y2 = y1 + Math.cos(this.time * 2.3) * r * 0.8;

                // Draw rods
                this.ctx.strokeStyle = this.color;
                this.ctx.lineWidth = 1.5;
                this.ctx.beginPath();
                this.ctx.moveTo(cx, cy);
                this.ctx.lineTo(x1, y1);
                this.ctx.lineTo(x2, y2);
                this.ctx.stroke();

                // Draw masses
                this.ctx.fillStyle = this.accent;
                this.ctx.beginPath();
                this.ctx.arc(x1, y1, 5, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.fillStyle = this.accentSecondary || this.secondary;
                this.ctx.beginPath();
                this.ctx.arc(x2, y2, 5, 0, Math.PI * 2);
                this.ctx.fill();

                // Draw pivot point
                this.ctx.fillStyle = this.color;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                this.ctx.fill();
            }
        }

        // ------------------------------------------------------------------
        // APP LOGIC
        // ------------------------------------------------------------------

        const App = {
            visuals: [],
            observer: null,
            pendingVisualTimeouts: [],
            renderVersion: 0,

            init() {
                this.setupObserver();
                this.setupFilters();
                this.renderGrid(DATA);
                this.animateLoop();

                // Color updates
                window.addEventListener('theme-changed', () => {
                    this.visuals.forEach(v => v.updateColors());
                });

                window.addEventListener('resize', () => {
                    this.visuals.forEach(v => v.resize());
                });
            },

            setupObserver() {
                this.observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const visual = this.visuals.find(v => v.canvas === entry.target);
                        if (visual) {
                            visual.isVisible = entry.isIntersecting;
                        }
                    });
                }, { threshold: 0.1 });
            },

            renderGrid(data) {
                const grid = document.getElementById('cardsGrid');
                const renderVersion = ++this.renderVersion;

                this.pendingVisualTimeouts.forEach(timeoutId => clearTimeout(timeoutId));
                this.pendingVisualTimeouts = [];
                grid.innerHTML = '';

                // Disconnect old observations
                this.visuals.forEach(v => this.observer.unobserve(v.canvas));
                this.visuals = [];

                if (data.length === 0) {
                    grid.innerHTML = '<div class="message-state">No topics found matching your criteria.</div>';
                    return;
                }

                data.forEach((item, index) => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = item.href;
                    card.style.opacity = 0;

                    card.innerHTML = `
                        <div class="card-visual">
                            <canvas id="canvas-${item.id}"></canvas>
                        </div>
                        <div class="card-content">
                            <div class="card-tag">${item.domain}</div>
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                            <div class="card-footer">
                                <span>Explore Module</span>
                                <i data-lucide="arrow-right" class="icon-arrow" width="16"></i>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Initialize Visual
                    const canvas = card.querySelector('canvas');
                    const timeoutId = setTimeout(() => {
                        if (renderVersion !== this.renderVersion || !canvas.isConnected) {
                            return;
                        }

                        let visual;
                        switch (item.type) {
                            case 'oscillation': visual = new OscillationVisual(canvas); break;
                            case 'projectile': visual = new ProjectileVisual(canvas); break;
                            case 'waves': visual = new WavesVisual(canvas); break;
                            case 'orbit': visual = new OrbitVisual(canvas); break;
                            case 'fields': visual = new FieldVisual(canvas); break;
                            case 'pendulum': visual = new PendulumVisual(canvas); break;
                            case 'slit': visual = new SlitVisual(canvas); break;
                            case 'magnetic': visual = new MagneticVisual(canvas); break;
                            case 'gravitational-waves': visual = new GravitationalWavesVisual(canvas); break;
                            case 'newtons-laws': visual = new NewtonsLawsVisual(canvas); break;
                            case 'conservation-energy': visual = new ConservationEnergyVisual(canvas); break;
                            case 'conservation-momentum': visual = new MomentumVisual(canvas); break;
                            case 'work-energy': visual = new WorkEnergyCardVisual(canvas); break;
                            case 'special-relativity': visual = new SpecialRelativityVisual(canvas); break;
                            case 'rotational-dynamics': visual = new RotationalDynamicsVisual(canvas); break;
                            case 'lagrangian-hamiltonian': visual = new LagrangianHamiltonianVisual(canvas); break;
                            default: visual = new BaseVisual(canvas);
                        }
                        visual.resize();
                        this.visuals.push(visual);
                        this.observer.observe(canvas); // OPTIMIZATION: Observe!
                    }, 50);
                    this.pendingVisualTimeouts.push(timeoutId);
                });

                if (window.lucide) window.lucide.createIcons();

                gsap.to('.card', {
                    opacity: 1,
                    y: 0,
                    duration: 0.6,
                    stagger: 0.1,
                    ease: "power2.out"
                });
            },

            setupFilters() {
                const searchInput = document.getElementById('searchInput');
                const filterBtns = document.querySelectorAll('.filter-chip');
                let currentFilter = 'all';
                let currentSearch = '';

                const filterData = () => {
                    const filtered = DATA.filter(item => {
                        const matchesDomain = currentFilter === 'all' || item.domain === currentFilter;
                        const matchesSearch = item.title.toLowerCase().includes(currentSearch) ||
                            item.desc.toLowerCase().includes(currentSearch);
                        return matchesDomain && matchesSearch;
                    });
                    this.renderGrid(filtered);
                };

                searchInput.addEventListener('input', (e) => {
                    currentSearch = e.target.value.toLowerCase();
                    filterData();
                });

                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        filterBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentFilter = btn.dataset.filter;
                        filterData();
                    });
                });
            },

            animateLoop() {
                // Loop is always running, but individual draw() calls check isVisible flag
                this.visuals.forEach(v => v.draw());
                requestAnimationFrame(() => this.animateLoop());
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            gsap.from('.library-header', { opacity: 0, y: -20, duration: 1, ease: 'power3.out' });
            App.init();
        });

    </script>
